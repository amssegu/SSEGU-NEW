name: Aggregate curated courses

on:
  schedule:
    - cron: '0 4 * * 2,5'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Run checks without building or deploying'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aggregate-courses-production
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture current production manifest
        if: github.event_name == 'schedule' || inputs.report_only == false
        run: curl --fail --location --silent --show-error --max-time 20 https://ssegu.com/work-data-manifest.json -o "$RUNNER_TEMP/previous-work-manifest.json" || echo '{}' > "$RUNNER_TEMP/previous-work-manifest.json"
      - name: Produce source-level course report
        id: report
        env:
          COURSE_REPORT_PATH: ${{ runner.temp }}/ssegu-courses-report.json
          COURSE_EXPORT_INPUT_PATH: ${{ runner.temp }}/ssegu-courses-export-input.json
        run: node scripts/aggregate-courses-report.mjs
      - name: Plan course catalogue database upsert
        if: github.event_name == 'schedule' || inputs.report_only == false
        env:
          COURSE_LIVE_REPORT_PATH: ${{ runner.temp }}/ssegu-courses-live-report.json
        run: node scripts/aggregate-courses-live.mjs
      - name: Apply course catalogue to D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production --remote --file "$RUNNER_TEMP/ssegu-courses-aggregation.sql"
      - name: Read publishable courses from D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT c.source_id,c.permission_type,c.availability_status,c.canonical_url,c.enrolment_url,c.slug,c.title,c.provider,c.summary,c.subject,c.level,c.delivery_mode,c.language,c.duration,c.course_price_status,c.certificate_price_status,c.last_seen_at,s.terms_url,s.attribution_text,s.enabled AS source_enabled FROM courses c JOIN content_sources s ON s.id=c.source_id WHERE s.enabled=1 AND c.availability_status IN ('available','unavailable','unverified') ORDER BY c.slug;"
          > "$RUNNER_TEMP/courses-query.json"
      - name: Read ingestion runs from D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT source_id,started_at,finished_at,result,accepted_count FROM ingestion_runs ORDER BY started_at DESC LIMIT 20;"
          > "$RUNNER_TEMP/ingestion-runs.json"
      - name: Read publishable jobs from D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT j.source_id,j.permission_type,j.status,j.canonical_url,j.application_url,j.slug,j.title,j.employer,j.location,j.category,j.employment_type,j.work_mode,j.permitted_excerpt,j.deadline_at,s.attribution_text,s.enabled AS source_enabled,CASE WHEN json_extract(s.restriction_flags_json,'$.prohibitJobpostingSchema') THEN 1 ELSE 0 END AS prohibit_jobposting_schema FROM jobs j JOIN content_sources s ON s.id=j.source_id WHERE s.enabled=1 AND j.status IN ('active','expired') ORDER BY j.slug;"
          > "$RUNNER_TEMP/jobs-query.json"
      - name: Prepare course build input from D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        run: node scripts/prepare-course-work-export-input.mjs "$RUNNER_TEMP/courses-query.json" "$RUNNER_TEMP/ssegu-courses-export-input.json"
      - name: Prepare job build input from D1
        if: github.event_name == 'schedule' || inputs.report_only == false
        run: node scripts/prepare-work-export-input.mjs "$RUNNER_TEMP/jobs-query.json" "$RUNNER_TEMP/ssegu-jobs-export-input.json"
      - name: Combine D1 Work data for build
        if: github.event_name == 'schedule' || inputs.report_only == false
        run: node scripts/merge-work-export-inputs.mjs "$RUNNER_TEMP/ssegu-jobs-export-input.json" "$RUNNER_TEMP/ssegu-courses-export-input.json" "$RUNNER_TEMP/ssegu-work-export-input.json"
      - name: Verify D1 write and generate public manifest
        id: manifest
        if: github.event_name == 'schedule' || inputs.report_only == false
        run: |
          node scripts/verify-aggregation-output.mjs "$RUNNER_TEMP/ssegu-courses-live-report.json" "$RUNNER_TEMP/ingestion-runs.json" "$RUNNER_TEMP/jobs-query.json" "$RUNNER_TEMP/courses-query.json"
          WORK_EXPORT_MODE=input WORK_EXPORT_INPUT="$RUNNER_TEMP/ssegu-work-export-input.json" WORK_EXPORT_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" npm run export:work
          node scripts/compare-work-manifests.mjs "$RUNNER_TEMP/previous-work-manifest.json" src/data/generated/manifest.json "$RUNNER_TEMP/work-manifest-comparison.json"
      - name: Build static site
        if: (github.event_name == 'schedule' || inputs.report_only == false) && steps.manifest.outputs.public_data_changed == 'true'
        run: WORK_EXPORT_MODE=input WORK_EXPORT_INPUT="$RUNNER_TEMP/ssegu-work-export-input.json" WORK_EXPORT_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" npm run build && cp src/data/generated/manifest.json dist/work-data-manifest.json
      - name: Deploy course dataset
        if: (github.event_name == 'schedule' || inputs.report_only == false) && steps.manifest.outputs.public_data_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name ssegu-new
      - name: Verify production Pages deployment
        if: (github.event_name == 'schedule' || inputs.report_only == false) && steps.manifest.outputs.public_data_changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 pages deployment list --project-name ssegu-new --json > "$RUNNER_TEMP/pages-deployments.json"
          node scripts/verify-pages-deployment.mjs "$RUNNER_TEMP/pages-deployments.json"
          curl --fail --location --silent --show-error --max-time 30 https://ssegu.com/work/courses/ > /dev/null
      - name: Upload report-only artifact
        if: github.event_name == 'workflow_dispatch' && inputs.report_only == true
        uses: actions/upload-artifact@v4
        with:
          name: courses-aggregation-report-${{ github.run_id }}
          retention-days: 30
          path: ${{ runner.temp }}/ssegu-courses-report.json
          if-no-files-found: error

      - name: Upload live aggregation evidence
        if: github.event_name == 'schedule' || inputs.report_only == false
        uses: actions/upload-artifact@v4
        with:
          name: courses-aggregation-report-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/ssegu-courses-report.json
            ${{ runner.temp }}/ssegu-courses-live-report.json
            ${{ runner.temp }}/work-manifest-comparison.json
            ${{ runner.temp }}/previous-work-manifest.json
            src/data/generated/manifest.json
            src/data/generated/jobs.json
            src/data/generated/courses.json
          if-no-files-found: error
