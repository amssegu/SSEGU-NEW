name: Aggregate direct course catalogs

on:
  schedule:
    - cron: '0 4 * * 2,5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: aggregate-courses-production
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Authenticate with Microsoft Entra ID
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Get Microsoft Learn API token
        if: ${{ vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' }}
        run: |
          token="$(az account get-access-token --resource https://learn.microsoft.com --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "MICROSOFT_LEARN_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Use Microsoft Learn API token secret
        if: ${{ vars.AZURE_CLIENT_ID == '' || vars.AZURE_TENANT_ID == '' || vars.AZURE_SUBSCRIPTION_ID == '' }}
        env:
          MICROSOFT_LEARN_ACCESS_TOKEN: ${{ secrets.MICROSOFT_LEARN_ACCESS_TOKEN }}
        run: |
          if [ -n "$MICROSOFT_LEARN_ACCESS_TOKEN" ]; then
            echo "::add-mask::$MICROSOFT_LEARN_ACCESS_TOKEN"
            echo "MICROSOFT_LEARN_ACCESS_TOKEN=$MICROSOFT_LEARN_ACCESS_TOKEN" >> "$GITHUB_ENV"
          fi
      - name: Plan course catalogue database upsert
        env:
          COURSE_LIVE_REPORT_PATH: ${{ runner.temp }}/ssegu-courses-live-report.json
        run: node scripts/aggregate-courses-live.mjs
      - name: Initialize courses D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 migrations apply ssegu-course-aggregation-production --remote
      - name: Apply course catalogue to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute ssegu-course-aggregation-production --remote --file "$RUNNER_TEMP/ssegu-courses-aggregation.sql"
      - name: Verify courses and source payloads in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-course-aggregation-production
          --remote --json
          --command "SELECT c.source_id,c.permission_type,c.availability_status,c.canonical_url,c.enrolment_url,c.slug,c.title,c.provider,c.summary,c.subject,c.level,c.delivery_mode,c.language,c.duration,c.course_price_status,c.certificate_price_status,c.last_seen_at,length(c.source_data_json) AS source_data_bytes,s.terms_url,s.attribution_text,s.enabled AS source_enabled FROM courses c JOIN content_sources s ON s.id=c.source_id WHERE s.enabled=1 AND c.source_id IN ('microsoft-learn-courses','freecodecamp-courses') AND c.availability_status IN ('available','unavailable','unverified') ORDER BY c.slug;"
          > "$RUNNER_TEMP/courses-query.json"
      - name: Read ingestion runs from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-course-aggregation-production
          --remote --json
          --command "SELECT source_id,started_at,finished_at,result,accepted_count FROM ingestion_runs ORDER BY started_at DESC LIMIT 20;"
          > "$RUNNER_TEMP/ingestion-runs.json"
      - name: Verify course D1 write
        run: |
          node scripts/verify-aggregation-output.mjs "$RUNNER_TEMP/ssegu-courses-live-report.json" "$RUNNER_TEMP/ingestion-runs.json" "$RUNNER_TEMP/courses-query.json"

      - name: Prepare courses site snapshot
        run: |
          node scripts/prepare-course-work-export-input.mjs "$RUNNER_TEMP/courses-query.json" "$RUNNER_TEMP/courses-export-input.json"
          node scripts/export-work-snapshot.mjs courses "$RUNNER_TEMP/courses-export-input.json"

      - name: Publish courses snapshot commit
        id: snapshot
        run: bash scripts/push-work-snapshot.sh src/data/snapshots/courses.json

      - name: Deploy work section snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-work-section.yml --ref main

      - name: Upload live aggregation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: courses-aggregation-report-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/ssegu-courses-live-report.json
            src/data/snapshots/courses.json
          if-no-files-found: error
