name: Publish work section snapshots

on:
  push:
    branches: [main]
    paths:
      - 'src/data/snapshots/jobs.json'
      - 'src/data/snapshots/courses.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-work-section-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest work snapshots
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site from work snapshots
        run: WORK_SNAPSHOT_BUILD=true npm run build

      - name: Smoke-check work snapshot pages
        run: npm run test:e2e

      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name ssegu-new
