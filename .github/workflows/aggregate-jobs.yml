name: Aggregate approved jobs

on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aggregate-jobs-production
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan live source ingestion
        env:
          AGGREGATION_REPORT_ONLY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/aggregate-jobs-live.mjs

      - name: Initialize jobs D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 migrations apply ssegu-work-aggregation-production --remote

      - name: Apply live aggregation plan to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production --remote --file "$RUNNER_TEMP/ssegu-aggregation.sql"

      - name: Verify jobs and source payloads in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT j.source_id,j.permission_type,j.status,j.canonical_url,j.application_url,j.slug,j.title,j.employer,j.location,j.country,j.category,j.employment_type,j.work_mode,j.permitted_excerpt,j.salary_text,j.salary_currency,j.salary_period,j.published_at,j.deadline_at,j.source_data_json,s.attribution_text,s.enabled AS source_enabled,CASE WHEN json_extract(s.restriction_flags_json,'$.prohibitJobpostingSchema') THEN 1 ELSE 0 END AS prohibit_jobposting_schema FROM jobs j JOIN content_sources s ON s.id=j.source_id WHERE s.enabled=1 AND j.status IN ('active','expired') ORDER BY j.slug;"
          > "$RUNNER_TEMP/jobs-query.json"

      - name: Read ingestion runs from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT source_id,started_at,finished_at,result,accepted_count FROM ingestion_runs ORDER BY started_at DESC LIMIT 20;"
          > "$RUNNER_TEMP/ingestion-runs.json"

      - name: Verify jobs D1 write
        run: |
          node scripts/verify-aggregation-output.mjs "$RUNNER_TEMP/ssegu-jobs-aggregation-report.json" "$RUNNER_TEMP/ingestion-runs.json" "$RUNNER_TEMP/jobs-query.json"

      - name: Prepare jobs site snapshot
        run: |
          node scripts/prepare-work-export-input.mjs "$RUNNER_TEMP/jobs-query.json" "$RUNNER_TEMP/jobs-export-input.json"
          node scripts/export-work-snapshot.mjs jobs "$RUNNER_TEMP/jobs-export-input.json"

      - name: Publish jobs snapshot commit
        id: snapshot
        run: bash scripts/push-work-snapshot.sh src/data/snapshots/jobs.json

      - name: Deploy work section snapshot
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-work-section.yml --ref main

      - name: Upload live aggregation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jobs-aggregation-report-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/ssegu-jobs-aggregation-report.json
            src/data/snapshots/jobs.json
          if-no-files-found: error
