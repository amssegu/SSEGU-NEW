name: Aggregate approved jobs

on:
  schedule:
    - cron: '15 3 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Exceptional manual rehearsal; do not enable live writes'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: aggregate-jobs-production
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run report-only source pass
        if: github.event_name == 'workflow_dispatch' && inputs.report_only == true
        env:
          AGGREGATION_REPORT_ONLY: 'true'
        run: node --experimental-strip-types scripts/aggregate-jobs-report.mjs

      - name: Plan live source ingestion
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_only == false)
        env:
          AGGREGATION_REPORT_ONLY: 'false'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types scripts/aggregate-jobs-live.mjs

      - name: Apply live aggregation plan to D1
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_only == false)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production --remote --file "$RUNNER_TEMP/ssegu-aggregation.sql"

      - name: Read publishable jobs from D1
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_only == false)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4.158.0 d1 execute ssegu-work-aggregation-production
          --remote --json
          --command "SELECT j.source_id,j.permission_type,j.status,j.canonical_url,j.application_url,j.slug,j.title,j.employer,j.location,j.category,j.employment_type,j.work_mode,j.permitted_excerpt,j.deadline_at,s.attribution_text,s.enabled AS source_enabled,CASE WHEN json_extract(s.restriction_flags_json,'$.prohibitJobpostingSchema') THEN 1 ELSE 0 END AS prohibit_jobposting_schema FROM jobs j JOIN content_sources s ON s.id=j.source_id WHERE s.enabled=1 AND j.status IN ('active','expired') ORDER BY j.slug;"
          > "$RUNNER_TEMP/jobs-query.json"

      - name: Build Cloudflare Pages artifact from D1 export
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_only == false)
        run: |
          node scripts/prepare-work-export-input.mjs "$RUNNER_TEMP/jobs-query.json" "$RUNNER_TEMP/work-export-input.json"
          WORK_EXPORT_MODE=input WORK_EXPORT_INPUT="$RUNNER_TEMP/work-export-input.json" npm run build

      - name: Deploy through Cloudflare Pages
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.report_only == false)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy dist --project-name ssegu-new

      - name: Upload per-source report
        uses: actions/upload-artifact@v4
        with:
          name: jobs-aggregation-report-${{ github.run_id }}
          path: ${{ runner.temp }}/ssegu-jobs-aggregation-report.json
          if-no-files-found: error

      # Cloudflare Pages remains the deployment owner. GitHub Actions only
      # orchestrates the scheduled build and invokes Cloudflare Pages after
      # automatic Git deployments have been disabled for this project.
