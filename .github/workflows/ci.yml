name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit checks
        run: npm test

      - name: Validate content collections and fixtures
        run: npm run validate:content

      - name: Build static site
        run: npm run build

      - name: Run static smoke checks
        run: npm run test:e2e
