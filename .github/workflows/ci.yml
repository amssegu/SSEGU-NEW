name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting in changed files
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch origin "${GITHUB_BASE_REF}" --depth=1
            RANGE="origin/${GITHUB_BASE_REF}...HEAD"
          else
            RANGE="${GITHUB_EVENT_BEFORE}..HEAD"
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "${RANGE}" | grep -v '^firimu-app/' | grep -E '\.(astro|css|html|js|jsx|json|md|mjs|ts|tsx|yaml|yml)
          if [[ -z "${FILES}" ]]; then
            echo "No changed files require formatting checks."
          else
            printf '%s\n' "${FILES}" | xargs -r npx prettier --check
          fi

      - name: Type check
        run: npm run check

      - name: Unit checks
        run: npm test

      - name: Submission security checks
        run: npm run test:security

      - name: Validate content collections and fixtures
        run: npm run validate:content

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Firimu dependencies
        working-directory: firimu-app
        run: bun install --frozen-lockfile

      - name: Build Firimu app
        working-directory: firimu-app
        run: bun run build

      - name: Build static site
        run: npm run build

      - name: Run static smoke checks
        run: npm run test:e2e
