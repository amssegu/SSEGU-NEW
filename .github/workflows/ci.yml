name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check workflow formatting
        run: npx prettier --check .github/workflows/ci.yml

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Firimu dependencies
        working-directory: firimu-app
        run: bun install --frozen-lockfile

      - name: Type check Firimu app
        working-directory: firimu-app
        run: bun run lint

      - name: Type check SSEGU site
        run: npm run check

      - name: Unit checks
        run: npm test

      - name: Submission security checks
        run: npm run test:security

      - name: Validate content collections and fixtures
        run: npm run validate:content

      - name: Build Firimu app
        working-directory: firimu-app
        run: bun run build

      - name: Build static site
        run: npm run build

      - name: Run static smoke checks
        run: npm run test:e2e
