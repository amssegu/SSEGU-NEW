# Nginx configuration snippet for https://ssegu.com/firimu/
# Add inside your existing `server { ... }` block for ssegu.com without altering root `/` routes.

# Option A: Proxying to Node.js (`npm start` running on port 3000)
location /firimu/ {
    proxy_pass http://127.0.0.1:3000/firimu/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

