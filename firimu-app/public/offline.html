<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Ssegu Movies (Firimu)</title>
    <meta name="theme-color" content="#0A0A0D" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0A0A0D;
        color: #F4F4F7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #121218;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #E50914;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 10px;
      }
      p {
        color: #A1A1B2;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      button {
        background: #E50914;
        color: #FFFFFF;
        border: none;
        border-radius: 10px;
        padding: 12px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #C40812; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#FFFFFF">
          <polygon points="7,4 20,12 7,20" />
        </svg>
      </div>
      <h1>You are currently offline</h1>
      <p>
        Ssegu Movies (Firimu) needs an active internet connection to load new movie releases and stream video files. Reconnect and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
